apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-service.name" . }}
  labels:
    {{- include "backend-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "backend-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend-service.serviceAccountName" . }}
  labels:
    {{- include "backend-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
